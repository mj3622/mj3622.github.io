<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Claude Code 开启市场自动更新</title><desc id="desc">运行斜杠 plugin，选择 Marketplaces，再选择 team-skills，开启 Enable auto-update。收到插件更新提示后重新加载或开启新会话</desc><defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#182332}.label{font-size:18px;fill:#566477}.body{font-size:19px}.small{font-size:15px;fill:#65748a}.title{font-size:28px;font-weight:650}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:17px}.step{font-size:19px;fill:white;font-weight:700}</style></defs>
<rect width="960" height="630" rx="20" fill="#edf2f7"/><text x="50" y="61" class="title">Claude Code：为自建市场开启自动更新</text><text x="50" y="94" class="small">操作路径示意 · 以实际客户端版本的菜单为准</text>
<rect x="50" y="126" width="860" height="91" rx="14" fill="white" stroke="#d6dee8"/><circle cx="91" cy="171" r="22" fill="#245fba"/><text x="85" y="178" class="step">1</text><text x="132" y="163" class="body" font-weight="600">进入插件管理</text><text x="132" y="192" class="label">在 Claude Code 会话输入 /plugin</text><rect x="50" y="238" width="860" height="91" rx="14" fill="white" stroke="#d6dee8"/><circle cx="91" cy="283" r="22" fill="#245fba"/><text x="85" y="290" class="step">2</text><text x="132" y="275" class="body" font-weight="600">切换到 Marketplaces</text><text x="132" y="304" class="label">选择团队市场 team-skills</text><rect x="50" y="350" width="860" height="91" rx="14" fill="white" stroke="#d6dee8"/><circle cx="91" cy="395" r="22" fill="#245fba"/><text x="85" y="402" class="step">3</text><text x="132" y="387" class="body" font-weight="600">选择 Enable auto-update</text><text x="132" y="416" class="label">确认该市场已开启自动更新</text><rect x="50" y="478" width="860" height="107" rx="14" fill="#e3f0ec"/><text x="75" y="513" class="body" font-weight="600">下载完成 ≠ 当前会话已经切换</text><text x="75" y="545" class="label">看到 Plugin updated 后，执行 /reload-plugins 或开启新会话</text><text x="50" y="613" class="small">自建市场默认关闭自动更新；只安装插件，还不足以接收后台更新</text></svg>